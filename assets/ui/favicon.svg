  <!-- abdômen -->
  <rect x="10" y="7" width="4" height="4" fill="#2c2118"/>
  <rect x="11" y="8" width="2" height="2" fill="#4a3520"/>
  <!-- tórax -->
  <rect x="7" y="7" width="2" height="3" fill="#3a2c1c"/>
  <!-- cabeça -->
  <rect x="4" y="6" width="3" height="3" fill="#4a3520"/>
