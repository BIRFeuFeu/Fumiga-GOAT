  <rect x="5" y="7" width="1" height="1" fill="#c8ff5a"/>
  <!-- antenas -->
  <rect x="3" y="4" width="1" height="1" fill="#6d5a41"/>
  <rect x="4" y="3" width="1" height="1" fill="#6d5a41"/>
  <rect x="6" y="4" width="1" height="1" fill="#6d5a41"/>
  <!-- pernas -->
  <rect x="7" y="10" width="1" height="2" fill="#6d5a41"/>
  <rect x="9" y="10" width="1" height="2" fill="#6d5a41"/>
  <rect x="11" y="11" width="1" height="2" fill="#6d5a41"/>
  <rect x="7" y="5" width="1" height="1" fill="#6d5a41"/>
  <rect x="9" y="5" width="1" height="1" fill="#6d5a41"/>
</svg>
