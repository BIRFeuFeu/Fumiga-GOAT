<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0705">
    <meta name="description" content="FUMIGA — Roguelite / Colony-Sim. Escave, colete, mute e sobreviva.">
    <title>FUMIGA — Beta</title>
    <link rel="icon" href="assets/ui/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Ponto de entrada: Canvas do Phaser (100% da tela, sem bordas) + UI DOM sobreposta -->
    <div id="game-container"></div>

    <!-- Vinheta da Pausa Tática + flash de dano da Rainha (acionados via classes no body) -->
    <div id="tactical-vignette"></div>
    <div id="damage-flash"></div>

    <!-- Tela de carregamento (estilos em css/style.css §boot-splash).
         O BootScene adiciona .hidden quando o Phaser assume. -->
    <div id="boot-splash">
        <div class="title">FUMIGA</div>
        <div class="bar"><i></i></div>
        <div class="hint">CARREGANDO ENGINE…</div>
    </div>

    <!-- Overlay de erros JS: se algo quebrar (script/grafo de cenas), o erro
         aparece AQUI na tela, em vez de uma página preta sem pistas. -->
    <pre id="boot-errors" hidden></pre>
    <script>
    (function () {
        'use strict';
        var box = document.getElementById('boot-errors');
        function show(msg) {
            if (!box) return;
            box.hidden = false;
            box.textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) {
            show('[ERRO] ' + (e.message || e.error) +
                 (e.filename ? '\n  em ' + e.filename + ':' + (e.lineno || '?') : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            show('[PROMISE] ' + (r && (r.stack || r.message) || r));
        });
    })();
    </script>

    <noscript>
        <div id="no-js">FUMIGA precisa de JavaScript habilitado.</div>
    </noscript>

    <!-- Engine: Phaser 3 (UMD, define o global `Phaser`). Vendored para rodar 100% offline e no APK. -->
    <script src="vendor/phaser.min.js"></script>
    <!-- Módulos ES6 do jogo (TDD §2) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
