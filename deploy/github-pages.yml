# ============================================================================
# FUMIGA — Colônia Eterna · publica o jogo no GitHub Pages
#
# O site publicado é EXATAMENTE a pasta game/ (HTML + módulos ES + sprites,
# todos com caminhos relativos, sem passo de build). A URL fica:
#
#     https://feufeup.github.io/Fumiga-GOAT/
#
# O que acontece a cada execução:
#   1) "Testes do jogo" roda a bateria headless do próprio projeto — auditoria
#      de sprites/texto, árvore da evolução, travamentos, layout das telas,
#      interface, e as simulações dos chefes dos mapas 1, 3 e 6;
#   2) só se tudo passar, "Publicar no GitHub Pages" copia game/ para _site/ e
#      publica. Nada quebrado vai para o ar.
#
# Pré-requisito (uma única vez, no navegador):
#     Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions
#
# Depois disso, todo merge na main republica o jogo sozinho — o repositório
# não depende de nenhuma IA para ficar no ar. Para publicar sem merge, use a
# aba Actions -> "Publicar o jogo (GitHub Pages)" -> Run workflow.
# ============================================================================

name: Publicar o jogo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar na mão, pela aba Actions

# Permissões mínimas exigidas pelo deploy oficial do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nunca deixar dois deploys do Pages se atropelarem
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    name: Testes do jogo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Os testes ficam em game/test/ e devem rodar de dentro de game/
      # (importam ../js/*.js e leem assets/ relativos à pasta do jogo).
      - name: Auditorias (sprites, árvore, travamentos, layout, interface)
        working-directory: game
        run: |
          node test/assets.mjs
          node test/tree.mjs
          node test/stuck.mjs
          node test/layout.mjs
          node test/uitest.mjs
          node test/attack.mjs
          node test/endless.mjs
          node test/prophecy.mjs

      - name: Simulação da expedição (chefes dos mapas 1, 3 e 6)
        working-directory: game
        run: |
          FORCE=1 node test/sim.mjs
          FORCE=3 node test/sim.mjs
          FORCE=6 node test/sim.mjs

  publicar:
    name: Publicar no GitHub Pages
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o site (a pasta game/ vira a raiz do site)
        run: |
          mkdir -p _site
          cp -r game/. _site/
          # nada de processamento Jekyll: o site é 100% estático
          touch _site/.nojekyll

      # O configure-pages sai com erro enquanto o Pages não estiver ativado.
      # Em vez de pintar a execução de vermelho, avisamos o que falta fazer.
      - name: Configurar o GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Enviar o artefato do site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5

      - name: Lembrete quando o Pages ainda não está ativado
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### ⚠️ Falta um clique para o jogo ficar no ar"
            echo ""
            echo "O GitHub Pages deste repositório ainda não está ativado."
            echo ""
            echo "1. Abra **Settings → Pages**"
            echo "2. Em *Build and deployment → Source*, escolha **GitHub Actions**"
            echo "3. Volte na aba **Actions** e rode este workflow de novo (*Run workflow*)"
            echo ""
            echo "Depois disso, todo merge na \`main\` publica o jogo automaticamente."
          } >> "$GITHUB_STEP_SUMMARY"
